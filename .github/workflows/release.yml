name: CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

# PR validation is independent. Every non-PR release shares one queue so the
# tested SHA cannot race another version/tag transaction.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'release-main' }}
  cancel-in-progress: false

jobs:
  check:
    name: Node and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check generated Claude skills
        run: node scripts/render-claude-skills.js --check
      - name: Run Node tests with coverage gate
        run: node --test --experimental-test-coverage --test-coverage-exclude='test/**' --test-coverage-lines=80 --test-coverage-functions=80 --test-coverage-branches=80
      - name: Run Python release tests
        run: python -m unittest discover -s test -p 'test_*.py'
      - name: Check extension syntax
        run: node --check extension.js

  release:
    name: Bump, tag and publish
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.actor != 'github-actions[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Publish tested revision or resume its release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: python release.py --source "$SOURCE_SHA" --bump "$BUMP" --push --github-release
